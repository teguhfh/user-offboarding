---
# tasks file for roles/offboarding_gitlab
#
# Workflow reference - "Checking GitLab"
#   user exists in GitLab      -> block / delete via the GitLab API
#   user not exists in GitLab  -> EXIT, nothing left to do
#
# https://docs.gitlab.com/api/users/#as-a-regular-user
#
# The write tasks are gated behind offboarding_execute, so the default run is
# a read-only dry run. The lookup needs an admin token: GitLab only returns the
# `email` field to admins, and the exact-match filter below depends on it.

########################################################################
# 1. Checking GitLab - look the user up by email, fall back to username
########################################################################

- name: Fail if neither a target email nor a target username was supplied
  ansible.builtin.fail:
    msg: "Set gitlab_target_email or gitlab_target_username - run roles/offboarding_intake first"
  when:
    - gitlab_target_email | length == 0
    - gitlab_target_username | length == 0

- name: Build the GitLab user lookup query
  ansible.builtin.set_fact:
    gitlab_user_query: >-
      {{ ('search=' ~ (gitlab_target_email | urlencode))
         if gitlab_target_email | length > 0
         else ('username=' ~ (gitlab_target_username | urlencode)) }}

- name: Get GitLab user info
  ansible.builtin.uri:
    url: "{{ gitlab_url }}/api/v4/users?{{ gitlab_user_query }}"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: 200
    validate_certs: "{{ gitlab_validate_certs | bool }}"
    ca_path: >-
      {{ gitlab_ca_path
         if (gitlab_validate_certs | bool and gitlab_ca_path | length > 0)
         else omit }}
  register: gitlab_user_lookup
  ignore_errors: "{{ offboarding_continue_on_error | default(true) | bool }}"
  no_log: false

- name: Note whether the GitLab lookup itself failed
  ansible.builtin.set_fact:
    gitlab_lookup_failed: "{{ gitlab_user_lookup.failed | default(false) | bool }}"

# A failed lookup leaves no .json to filter, so short-circuit to an empty list
# and let gitlab_user_exists come out false. Every write task below is already
# gated on that, so the role walks itself to the end and lands on the manual
# list at the bottom instead of aborting the whole role here.
- name: Narrow the lookup down to an exact email match
  ansible.builtin.set_fact:
    gitlab_matched_users: >-
      {{ []
         if gitlab_lookup_failed | bool
         else ((gitlab_user_lookup.json | selectattr('email', 'defined')
                                        | selectattr('email', 'equalto', gitlab_target_email | lower) | list)
               if gitlab_target_email | length > 0
               else gitlab_user_lookup.json) }}

# `matched[0].foo | default('')` does NOT survive an empty list: the index
# yields Undefined and the attribute lookup on it raises before default()
# ever runs. The user-not-in-GitLab path is exactly that case, so guard the
# index with an inline conditional, which Jinja evaluates lazily.
- name: Set GitLab user facts
  ansible.builtin.set_fact:
    gitlab_user_exists: "{{ gitlab_matched_users | length > 0 }}"
    gitlab_user_id: "{{ (gitlab_matched_users | first).id if gitlab_matched_users | length > 0 else '' }}"
    gitlab_user_state: "{{ (gitlab_matched_users | first).state if gitlab_matched_users | length > 0 else '' }}"
    gitlab_username: "{{ (gitlab_matched_users | first).username if gitlab_matched_users | length > 0 else '' }}"

- name: Show current user info
  ansible.builtin.debug:
    msg:
      id: "{{ gitlab_user_id }}"
      username: "{{ gitlab_username }}"
      email: "{{ gitlab_target_email }}"
      state: "{{ gitlab_user_state }}"
  when: gitlab_user_exists | bool

- name: EXIT - user does not exist in GitLab
  ansible.builtin.debug:
    msg: "GitLab user {{ gitlab_target_email | default(gitlab_target_username, true) }} not found - nothing to do"
  when:
    - not (gitlab_user_exists | bool)
    - not (gitlab_lookup_failed | bool)

- name: EXIT - the GitLab lookup could not be completed
  ansible.builtin.debug:
    msg: >-
      GitLab lookup failed ({{ gitlab_user_lookup.msg | default('see job log') }})
      - GitLab left untouched, listed under MANUAL ACTION REQUIRED
  when: gitlab_lookup_failed | bool

# # 2. Block user first (reversible, default action)
- name: Block GitLab user
  ansible.builtin.uri:
    url: "{{ gitlab_url }}/api/v4/users/{{ gitlab_user_id }}/block"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: [201, 200, 204]
    validate_certs: "{{ gitlab_validate_certs | bool }}"
    ca_path: >-
      {{ gitlab_ca_path
         if (gitlab_validate_certs | bool and gitlab_ca_path | length > 0)
         else omit }}
  register: gitlab_block_result
  ignore_errors: "{{ offboarding_continue_on_error | default(true) | bool }}"
  no_log: false
  when:
    - gitlab_user_exists | bool
    - gitlab_user_state not in ['blocked', 'ldap_blocked', 'banned']
    - offboarding_execute | default(false) | bool

- name: Report block result
  ansible.builtin.debug:
    msg: >-
      {{ 'User already ' + gitlab_user_state + ', no action taken'
         if gitlab_user_state in ['blocked', 'ldap_blocked', 'banned']
         else ('User has been blocked successfully'
               if offboarding_execute | default(false) | bool
               else 'DRY RUN - would block GitLab user ' + gitlab_username) }}
  when:
    - gitlab_user_exists | bool
    - not (gitlab_block_result.failed | default(false))

# # 3. Check groups owned by user before delete (safety check)
- name: Get groups owned by user
  ansible.builtin.uri:
    url: "{{ gitlab_url }}/api/v4/users/{{ gitlab_user_id }}/memberships?type=Namespace"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: 200
    validate_certs: "{{ gitlab_validate_certs | bool }}"
    ca_path: >-
      {{ gitlab_ca_path
         if (gitlab_validate_certs | bool and gitlab_ca_path | length > 0)
         else omit }}
  register: gitlab_user_memberships
  ignore_errors: "{{ offboarding_continue_on_error | default(true) | bool }}"
  no_log: false
  when:
    - gitlab_user_exists | bool
    - gitlab_delete_user_permanently | default(false) | bool

- name: Warn if user is sole owner of any group
  ansible.builtin.debug:
    msg: >-
      WARNING: User may own groups - verify manually before delete:
      {{ gitlab_user_memberships.json | map(attribute='source_name') | list }}
  when:
    - gitlab_delete_user_permanently | default(false) | bool
    - gitlab_user_memberships.json | default([]) | length > 0

# # 4. Delete user only with explicit confirmation flag
- name: Delete GitLab user (soft - keeps contributions as Ghost User)
  ansible.builtin.uri:
    url: "{{ gitlab_url }}/api/v4/users/{{ gitlab_user_id }}?hard_delete=false"
    method: DELETE
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: 204
    validate_certs: "{{ gitlab_validate_certs | bool }}"
    ca_path: >-
      {{ gitlab_ca_path
         if (gitlab_validate_certs | bool and gitlab_ca_path | length > 0)
         else omit }}
  register: gitlab_delete_result
  ignore_errors: "{{ offboarding_continue_on_error | default(true) | bool }}"
  no_log: false
  when:
    - gitlab_user_exists | bool
    - gitlab_delete_user_permanently | default(false) | bool
    - not gitlab_hard_delete | default(false) | bool
    - offboarding_execute | default(false) | bool

- name: Delete GitLab user AND all contributions (hard delete - irreversible)
  ansible.builtin.uri:
    url: "{{ gitlab_url }}/api/v4/users/{{ gitlab_user_id }}?hard_delete=true"
    method: DELETE
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: 204
    validate_certs: "{{ gitlab_validate_certs | bool }}"
    ca_path: >-
      {{ gitlab_ca_path
         if (gitlab_validate_certs | bool and gitlab_ca_path | length > 0)
         else omit }}
  register: gitlab_hard_delete_result
  ignore_errors: "{{ offboarding_continue_on_error | default(true) | bool }}"
  no_log: false
  when:
    - gitlab_user_exists | bool
    - gitlab_delete_user_permanently | default(false) | bool
    - gitlab_hard_delete | default(false) | bool
    - offboarding_execute | default(false) | bool

- name: Report delete result
  ansible.builtin.debug:
    msg: >-
      {{ 'Delete not requested - user remains blocked only'
         if not (gitlab_delete_user_permanently | default(false) | bool)
         else ((offboarding_execute | default(false) | bool) | ternary('', 'DRY RUN - would ')
               + ('hard delete: user and all contributions removed permanently'
                  if gitlab_hard_delete | default(false) | bool
                  else 'soft delete: user removed, contributions preserved as Ghost User')) }}
  when:
    - gitlab_user_exists | bool
    - not (gitlab_delete_result.failed | default(false))
    - not (gitlab_hard_delete_result.failed | default(false))

- name: Collect GitLab steps that need manual follow-up
  ansible.builtin.set_fact:
    offboarding_manual: >-
      {{ offboarding_manual | default([])
           + (['GitLab: look the user up - ' ~ (gitlab_user_lookup.msg | default('see job log'))]
              if gitlab_lookup_failed | default(false) else [])
           + (['GitLab: list the groups the user owns']
              if gitlab_user_memberships.failed | default(false) else [])
           + (['GitLab: block the user'] if gitlab_block_result.failed | default(false) else [])
           + (['GitLab: soft delete the user'] if gitlab_delete_result.failed | default(false) else [])
           + (['GitLab: hard delete the user'] if gitlab_hard_delete_result.failed | default(false) else []) }}
