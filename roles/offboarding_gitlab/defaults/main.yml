---
# defaults file for roles/offboarding_gitlab
gitlab_url: "https://gitlab.ss-wlabid.net"

# Lookup is by email when set (that is what the trigger gives us), and falls
# back to username otherwise. gitlab_target_email is normally set by
# roles/offboarding_intake.
gitlab_target_email: ""
gitlab_target_username: ""

gitlab_delete_user_permanently: false
gitlab_hard_delete: false

# GitLab sits behind an internal CA (WeLab ID Non-Production Application CA G1)
# that the execution environment does not trust, which is what produced the
# CERTIFICATE_VERIFY_FAILED on the lookup.
#
# Verification is OFF by default because the CA bundle is not available yet.
# That is a deliberate trade-off, not an oversight: the uri tasks send an admin
# PRIVATE-TOKEN, and with verification off nothing proves the host answering is
# really GitLab, so that token is exposed to anyone able to intercept the
# connection. Acceptable against this non-production instance, NOT acceptable
# against a production GitLab.
#
# To put verification back: complete files/gitlab-ca-bundle.crt (the single
# command is in that file's header) and set gitlab_validate_certs to true.
# gitlab_ca_path is ignored while gitlab_validate_certs is false; set it to ""
# to use the system trust store instead of the bundled file.
gitlab_ca_path: "{{ role_path }}/files/gitlab-ca-bundle.crt"
gitlab_validate_certs: false
