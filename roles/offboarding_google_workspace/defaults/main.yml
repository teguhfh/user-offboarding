---
# defaults file for roles/offboarding_google_workspace

# Normally set by roles/offboarding_intake. Left empty on purpose so that a run
# without a parsed request fails loudly instead of hitting the wrong account.
gws_target_email: ""

# Admin the service account impersonates through domain-wide delegation, from
# the AAP google workspace credential type. User Management Admin is enough.
#
# Leave empty only when the service account holds an admin role directly
# (Admin Console -> Account -> Admin roles) - then no --subject is sent and
# nobody is impersonated. If it is empty and the service account has no role
# of its own, the Directory API answers 403.
gws_admin_email: ""

# Where the service account key lives. In AAP the credential type writes the
# file itself and injects gws_service_account_key_path; outside AAP the raw
# JSON arrives as gcp_sa_key and the role writes it to the fallback path.
gws_sa_key_path: "{{ gws_service_account_key_path | default('/tmp/gws-sa.json') }}"

# Force sign-out resets the user's sign-in cookies so active sessions drop
# immediately instead of ending at the next revalidation. Suspending already
# blocks sign-in, so this only buys immediacy - and it costs an extra scope
# plus the user-security privilege on the admin role. Note it does NOT revoke
# OAuth tokens held by third-party apps; that is tokens.delete, per app.
gws_force_signout: true

# Every scope the role needs, minted into one token. Each entry has to be
# authorised for the service account - under Domain-wide delegation when an
# admin is impersonated, or through the admin role assigned to the service
# account itself. A readonly entry does not cover a read-write request.
#
#   admin.directory.user           get, suspend, delete
#   admin.directory.user.security  signOut only - requested solely when
#                                  gws_force_signout is true, so turning the
#                                  toggle off also drops the privilege need
gws_scopes: "{{ ['https://www.googleapis.com/auth/admin.directory.user']
                + (['https://www.googleapis.com/auth/admin.directory.user.security']
                   if gws_force_signout | bool else []) }}"

# Permanent delete is irreversible - keep false and rely on suspend by default.
gws_delete_user_permanently: false
