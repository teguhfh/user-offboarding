---
# defaults file for roles/offboarding_google_workspace

# Normally set by roles/offboarding_intake. Left empty on purpose so that a run
# without a parsed request fails loudly instead of hitting the wrong account.
gws_target_email: ""

# Admin the service account impersonates through domain-wide delegation, from
# the AAP google workspace credential type. User Management Admin is enough.
#
# Leave empty only when the service account holds an admin role directly
# (Admin Console -> Account -> Admin roles) - then no --subject is sent and
# nobody is impersonated. If it is empty and the service account has no role
# of its own, the Directory API answers 403.
gws_admin_email: ""

# Where the service account key lives. In AAP the credential type writes the
# file itself and injects gws_service_account_key_path; outside AAP the raw
# JSON arrives as gcp_sa_key and the role writes it to the fallback path.
gws_sa_key_path: "{{ gws_service_account_key_path | default('/tmp/gws-sa.json') }}"

# Read-only is not enough once the write tasks are live - suspend, sign-out and
# delete all need the read-write scope, and it must also be authorised for the
# service account under Domain-wide delegation in the Admin Console.
gws_scope: "https://www.googleapis.com/auth/admin.directory.user"

# Permanent delete is irreversible - keep false and rely on suspend by default.
gws_delete_user_permanently: false
