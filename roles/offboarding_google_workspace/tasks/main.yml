---
# tasks file for roles/offboarding_google_workspace
#
# Workflow reference - "Checking Google Workspace"
#   user exists in GWS      -> suspend / sign out / delete via the Directory API
#   user not exists in GWS  -> SKIP, continue to the GitLab check
#
# The write tasks are gated behind offboarding_execute, so the default run is a
# read-only dry run. gws_scope must be the read-write scope for suspend/delete
# to work, and that same scope has to be authorised for the service account in
# Admin Console -> Security -> API controls -> Domain-wide delegation.
#
# Set offboarding_debug=true to lift no_log from the API calls when a request
# fails. The key material and the access token stay redacted regardless.

- name: Google Workspace offboarding
  block:

    ####################################################################
    # Authenticate - materialise the service account key and mint a token
    #
    # In AAP the Google Workspace credential type writes the key file itself
    # and injects its path as gws_service_account_key_path, so there is
    # nothing to materialise. Outside AAP the raw JSON arrives as gcp_sa_key
    # and this role writes it to a temp file removed in the always block.
    ####################################################################

    - name: Fail if no target email was supplied
      ansible.builtin.fail:
        msg: "gws_target_email is empty - run roles/offboarding_intake first or pass it as an extra var"
      when: gws_target_email | length == 0

    - name: Fail if no admin email was supplied for impersonation
      ansible.builtin.fail:
        msg: >-
          gws_admin_email is empty. The Admin SDK Directory API rejects a bare
          service account - it must impersonate a super admin via domain-wide
          delegation. Supply gws_admin_email from the AAP credential.
      when: gws_admin_email | length == 0

    - name: Create temporary service account key
      ansible.builtin.copy:
        content: "{{ gcp_sa_key }}"
        dest: "{{ gws_sa_key_path }}"
        mode: "0600"
      no_log: false
      when: gws_service_account_key_path | default('') | length == 0

    - name: Generate Google Workspace access token via service account
      ansible.builtin.command:
        argv:
          - python3
          - "{{ role_path }}/files/gws_get_token.py"
          - --sa-key-file
          - "{{ gws_sa_key_path }}"
          - --scope
          - "{{ gws_scope }}"
          - --subject
          - "{{ gws_admin_email }}"
      register: gws_token_result
      changed_when: false
      no_log: false

    - name: Set access token fact
      ansible.builtin.set_fact:
        gws_access_token: "{{ gws_token_result.stdout | trim }}"
      no_log: false

    ####################################################################
    # Checking Google Workspace - does the user exist?
    ####################################################################

    - name: Get Google Workspace user details
      ansible.builtin.uri:
        url: "https://admin.googleapis.com/admin/directory/v1/users/{{ gws_target_email }}"
        method: GET
        headers:
          Authorization: "Bearer {{ gws_access_token }}"
        status_code: [200, 404]
      register: gws_user_info
      no_log: "{{ not (offboarding_debug | default(false) | bool) }}"

    - name: Set Google Workspace user facts
      ansible.builtin.set_fact:
        gws_user_exists: "{{ gws_user_info.status == 200 }}"
        gws_user_id: "{{ gws_user_info.json.id | default('') }}"
        gws_user_suspended: "{{ gws_user_info.json.suspended | default(false) | bool }}"

    - name: Show current user info
      ansible.builtin.debug:
        msg:
          id: "{{ gws_user_id }}"
          primaryEmail: "{{ gws_user_info.json.primaryEmail | default('') }}"
          fullName: "{{ gws_user_info.json.name.fullName | default('') }}"
          suspended: "{{ gws_user_suspended }}"
          orgUnitPath: "{{ gws_user_info.json.orgUnitPath | default('') }}"
      when: gws_user_exists | bool

    - name: SKIP - user does not exist in Google Workspace
      ansible.builtin.debug:
        msg: "User {{ gws_target_email }} not found in Google Workspace - skipping to the GitLab check"
      when: not (gws_user_exists | bool)

    ####################################################################
    # Suspend the account (reversible, the default offboarding action)
    ####################################################################

    - name: Suspend Google Workspace user
      ansible.builtin.uri:
        url: "https://admin.googleapis.com/admin/directory/v1/users/{{ gws_target_email }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ gws_access_token }}"
        body_format: json
        body:
          suspended: true
        status_code: 200
      register: gws_suspend_result
      no_log: "{{ not (offboarding_debug | default(false) | bool) }}"
      when:
        - gws_user_exists | bool
        - not (gws_user_suspended | bool)
        - offboarding_execute | default(false) | bool

    - name: Report suspend result
      ansible.builtin.debug:
        msg: >-
          {{ 'User already suspended, no action taken'
             if gws_user_suspended
             else ('User has been suspended successfully'
                   if offboarding_execute | default(false) | bool
                   else 'DRY RUN - would suspend ' + gws_target_email) }}
      when: gws_user_exists | bool

    ####################################################################
    # Force sign out - invalidate all active sessions and OAuth tokens
    ####################################################################

    - name: Sign the user out of all Google sessions
      ansible.builtin.uri:
        url: "https://admin.googleapis.com/admin/directory/v1/users/{{ gws_user_id }}/signOut"
        method: POST
        headers:
          Authorization: "Bearer {{ gws_access_token }}"
        status_code: [200, 204]
      register: gws_signout_result
      no_log: "{{ not (offboarding_debug | default(false) | bool) }}"
      when:
        - gws_user_exists | bool
        - offboarding_execute | default(false) | bool

    - name: Report force sign out result
      ansible.builtin.debug:
        msg: >-
          {{ 'All Google sessions and OAuth tokens revoked for ' + gws_target_email
             if offboarding_execute | default(false) | bool
             else 'DRY RUN - would revoke all Google sessions for ' + gws_target_email }}
      when: gws_user_exists | bool

    ####################################################################
    # Delete the account - only with an explicit confirmation flag.
    # Consider transferring Drive/Gmail data first (Data Transfer API),
    # deleting a user destroys their data after the recovery window.
    ####################################################################

    - name: Delete Google Workspace user
      ansible.builtin.uri:
        url: "https://admin.googleapis.com/admin/directory/v1/users/{{ gws_target_email }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ gws_access_token }}"
        status_code: [200, 204]
      register: gws_delete_result
      no_log: "{{ not (offboarding_debug | default(false) | bool) }}"
      when:
        - gws_user_exists | bool
        - gws_delete_user_permanently | default(false) | bool
        - offboarding_execute | default(false) | bool

    - name: Report delete result
      ansible.builtin.debug:
        msg: >-
          {{ 'Delete not requested - user remains suspended only'
             if not (gws_delete_user_permanently | default(false) | bool)
             else ('User deleted from Google Workspace'
                   if offboarding_execute | default(false) | bool
                   else 'DRY RUN - would permanently delete ' + gws_target_email) }}
      when: gws_user_exists | bool

  always:
    # Only our own temp file. In AAP the key file belongs to the credential
    # injector and is cleaned up by the platform when the job ends.
    - name: Remove the temporary service account key
      ansible.builtin.file:
        path: "{{ gws_sa_key_path }}"
        state: absent
      when: gws_service_account_key_path | default('') | length == 0
