---
# tasks file for roles/offboarding_ad
#
# Workflow reference - PHASE 2: WINDOWS ACTIVE DIRECTORY (On-Premises Deprovisioning)
#   7   Open Windows Active Directory  -> LDAPS bind, handled by the module
#   8   Open AD Users & Computers      -> GUI-only step, no automation equivalent
#   9   Search for user                -> community.general.ldap_search
#   10  Disable user account           -> ldap_attrs, ACCOUNTDISABLE bit on userAccountControl
#   11  Remove from sync group         -> ldap_attrs, member absent on the Entra Connect group
#
# Steps 10-11 change state and are commented out until dummy test data exists.
# When uncommenting, they are additionally gated behind offboarding_execute.

########################################################################
# Steps 7-9 - Bind to AD and search for the user
########################################################################

- name: Fail if no target sAMAccountName was supplied
  ansible.builtin.fail:
    msg: "target_samaccountname is empty - run roles/offboarding_intake first or pass it as an extra var"
  when: target_samaccountname | length == 0

- name: Query current userAccountControl for target user
  community.general.ldap_search:
    dn: "{{ ldap_search_base }}"
    server_uri: "{{ ldap_server_uri }}"
    bind_dn: "{{ ldap_bind_dn }}"
    bind_pw: "{{ ldap_bind_password }}"
    scope: "children"
    filter: "(sAMAccountName={{ target_samaccountname }})"
    attrs:
      - dn
      - userAccountControl
  register: ldap_result
  no_log: false

- name: Fail if user not found
  ansible.builtin.fail:
    msg: "User {{ target_samaccountname }} not found in AD"
  when: ldap_result.results | length == 0

- name: Set facts from query result
  ansible.builtin.set_fact:
    user_dn: "{{ ldap_result.results[0].dn }}"
    # ldap_search returns a single-valued attribute as a plain string ("512"),
    # so a bare [0] would take the first *character* and read 512 as 5.
    # Wrapping in a list and flattening handles both the string and list shape.
    current_uac: "{{ [ldap_result.results[0].userAccountControl] | flatten | first | int }}"

- name: Determine if account is currently disabled
  ansible.builtin.set_fact:
    is_disabled: "{{ ((current_uac | int // uac_disable_bit | int) % 2) == 1 }}"

- name: Show current status
  ansible.builtin.debug:
    msg: "User {{ target_samaccountname }} ({{ user_dn }}) - current UAC: {{ current_uac }}, disabled: {{ is_disabled }}"

- name: Calculate new UAC value with disable bit set
  ansible.builtin.set_fact:
    new_uac: "{{ (current_uac | int) + (uac_disable_bit | int) }}"
  when: not is_disabled


#############################################################
# Step 10 - Disable user account
#############################################################

- name: Disable the account (set ACCOUNTDISABLE bit)
  community.general.ldap_attrs:
    dn: "{{ user_dn }}"
    attributes:
      userAccountControl: "{{ new_uac }}"
    state: exact
    server_uri: "{{ ldap_server_uri }}"
    bind_dn: "{{ ldap_bind_dn }}"
    bind_pw: "{{ ldap_bind_password }}"
  register: disable_result
  ignore_errors: "{{ offboarding_continue_on_error | default(true) | bool }}"
  no_log: false
  when:
    - not is_disabled
    - offboarding_execute | default(false) | bool

- name: Report action taken
  ansible.builtin.debug:
    msg: >-
      {{ 'Account was already disabled, no action taken'
         if is_disabled
         else (('Account has been disabled successfully (UAC: '
                if offboarding_execute | default(false) | bool
                else 'DRY RUN - would disable the account (UAC: ')
               + current_uac|string + ' -> ' + new_uac|string + ')') }}
  when: not (disable_result.failed | default(false))


#############################################################
# Step 11 - Remove from Entra Connect sync group
#############################################################

- name: Remove user from AzureSyncUsers group
  community.general.ldap_attrs:
    dn: "{{ azure_sync_group_dn }}"
    attributes:
      member: "{{ user_dn }}"
    state: absent
    server_uri: "{{ ldap_server_uri }}"
    bind_dn: "{{ ldap_bind_dn }}"
    bind_pw: "{{ ldap_bind_password }}"
  register: remove_group_result
  ignore_errors: "{{ offboarding_continue_on_error | default(true) | bool }}"
  no_log: false
  when:
    - ad_remove_from_sync_group | bool
    - offboarding_execute | default(false) | bool

- name: Report group removal result
  ansible.builtin.debug:
    msg: >-
      {{ 'SKIPPED - ad_remove_from_sync_group is false, the account stays in sync scope'
         if not (ad_remove_from_sync_group | bool)
         else ('DRY RUN - would remove the user from the Entra Connect sync group'
               if not (offboarding_execute | default(false) | bool)
               else ('User removed from AzureSyncUsers group'
                     if remove_group_result.changed
                     else 'User was not a member of AzureSyncUsers group, no action taken')) }}
  when: not (remove_group_result.failed | default(false))


- name: Collect Windows Active Directory steps that need manual follow-up
  ansible.builtin.set_fact:
    offboarding_manual: >-
      {{ offboarding_manual | default([])
           + (['Windows Active Directory: disable the account'] if disable_result.failed | default(false) else [])
           + (['Windows Active Directory: remove from the Entra Connect sync group'] if remove_group_result.failed | default(false) else []) }}

#############################################################
# Verification - re-read the account to confirm phase 2 landed
#############################################################

- name: Re-query userAccountControl to verify the account is disabled
  community.general.ldap_search:
    dn: "{{ ldap_search_base }}"
    server_uri: "{{ ldap_server_uri }}"
    bind_dn: "{{ ldap_bind_dn }}"
    bind_pw: "{{ ldap_bind_password }}"
    scope: "children"
    filter: "(sAMAccountName={{ target_samaccountname }})"
    attrs:
      - dn
      - userAccountControl
  register: ldap_verify
  no_log: false
  when: offboarding_execute | default(false) | bool

- name: Read back the verified userAccountControl
  ansible.builtin.set_fact:
    verified_uac: "{{ [ldap_verify.results[0].userAccountControl] | flatten | first | int }}"
  when: offboarding_execute | default(false) | bool

- name: Report verification result
  ansible.builtin.debug:
    msg: >-
      Post-change UAC: {{ verified_uac }} -
      disabled: {{ ((verified_uac | int // uac_disable_bit | int) % 2) == 1 }}
  when: offboarding_execute | default(false) | bool

- name: Fail if the account did not end up disabled
  ansible.builtin.fail:
    msg: >-
      Phase 2 did not land - userAccountControl is {{ verified_uac }} and the
      ACCOUNTDISABLE bit is still clear. Check the bind account's write
      permission on {{ user_dn }}.
  when:
    - offboarding_execute | default(false) | bool
    - ((verified_uac | int // uac_disable_bit | int) % 2) != 1
