[defaults]
inventory = inventory/local.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent

# No privilege escalation block on purpose. Every task here is an API call or
# an LDAP bind that runs inside the execution environment as the unprivileged
# `runner` user, which has no sudo - turning become on makes every task fail.
